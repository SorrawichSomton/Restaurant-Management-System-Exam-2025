name: RMS CI/CD

on:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Backend Security Scan
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Start backend server
        working-directory: backend
        run: |
          echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/booking_app"' > .env
          echo 'JWT_SECRET="supersecretkey"' >> .env
          echo 'PORT=3001' >> .env
          echo 'NODE_ENV=development' >> .env
          echo 'CORS_ORIGIN=http://localhost:5173' >> .env

          npx prisma db push
          npx tsx prisma/seed.ts
          npm run dev &
          sleep 20

      - name: Run Newman Tests
        run: newman run tests/postman/RMS-68030287-TestSuite.json --environment tests/postman/env.json --verbose
            